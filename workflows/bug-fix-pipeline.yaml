# ===== Workflow 元数据 =====
name: bug-fix-pipeline
version: "1.0.0"
description: "AIOps 智能体工作流 - 诊断 + 修复 + 审批 + 提交（design §8.1）"

# ===== Workflow 入参 =====
inputs:
  bug_report:
    type: object
    required: true
    description: "来自 ServiceNow/Alertmanager 的原始事件"
  repos:
    type: object
    required: false
    description: "服务到仓库的映射；不提供则由 CMDB 查询"

# ===== 节点定义 =====
nodes:
  # ===== 诊断阶段（只读，on_failure 负证据策略）=====
  triage:
    agent: triage
    params: { bug: "$.inputs.bug_report" }
    on_failure: abort

  # ===== 定位问题服务（design-v5.7 §3）=====
  # 取数之前必须先知道"查哪个服务"。**bug_report 必须单独传**——triage 的输出 schema
  # 只有 {symptom_type, severity, summary}，`cmdb_ci.name` 在 triage 之后就丢了。
  # 注：本 pipeline 无时间窗（早于 v5.5 的窗口要求），故 scope 也不传 start/end。
  scope:
    agent: service-scoper
    join: all
    required_edges: [triage]
    params:
      bug: "$.nodes.triage.output.summary"
      bug_report: "$.inputs.bug_report"
    on_failure: abort

  # ⚠️ 四个取数节点：`join: all` + `required_edges: [triage, scope]`。
  # 默认 `join: any` 会让它们在 triage 一完成就调度——此时 scope 还没跑，
  # `candidate_services` 是 None（executor/dag_executor.py:259）。
  logs:
    agent: log-analyst
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      services: "$.nodes.scope.output.candidate_services"
    on_failure: continue

  trace:
    agent: trace-analyst
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      services: "$.nodes.scope.output.candidate_services"
    on_failure: abort

  metrics:
    agent: metrics-analyst
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      services: "$.nodes.scope.output.candidate_services"
    on_failure: continue

  infra:
    agent: infra-locator
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      services: "$.nodes.scope.output.candidate_services"
    on_failure: continue

  locate:
    agent: code-locator
    params:
      bug: "$.nodes.triage.output.summary"
      target_service: "$.nodes.trace.output.failing_service"
    on_failure: abort

  know:
    agent: knowledge-lookup
    params: { bug: "$.nodes.triage.output.summary" }
    on_failure: continue

  rca:
    agent: root-cause
    params:
      logs: "$.nodes.logs.output.summary"
      trace: "$.nodes.trace.output.summary"
      metrics: "$.nodes.metrics.output.summary"
      infra: "$.nodes.infra.output.summary"
      code: "$.nodes.locate.output.summary"
      know: "$.nodes.know.output.summary"
      # design-v5.7 §6：scope 的定位与 trace 的 failing_service 一起交给根因节点交叉判断
      scope_primary: "$.nodes.scope.output.primary_service"
    on_failure: abort

  plan:
    agent: fix-planner
    params: { rca: "$.nodes.rca.output" }
    on_failure: abort

  # ===== 修复阶段（并行，join: all）=====
  # service 显式取自 code-locator 的 CMDB 定位结果——工作区工具（ws_read_file 等）
  # 要求 service 精确匹配已 prepare 的仓库目录，不能让 LLM 从 bug 描述里猜。
  fix:
    agent: fix-implementer
    params:
      plan: "$.nodes.plan.output"
      service: "$.nodes.locate.output.service"
    retry: 2

  remediate:
    agent: infra-remediator
    params: { plan: "$.nodes.plan.output" }
    retry: 1

  # ===== 合并审批节点（join: all —— 等待 fix + remediate 都完成，保证合并展示）=====
  approve-changes:
    kind: approval
    name: "审批修复方案"
    join: all
    required_edges: [fix, remediate]
    params:
      diff: "$.nodes.fix.output.diff"
      k8s_changes: "$.nodes.remediate.output.changes"
      plan: "$.nodes.plan.output"
    approvers: ["lead-engineer", "security-team"]
    timeout: 3600
    on_reject: abort

  # ===== 测试阶段 =====
  test:
    agent: tester
    params:
      fix: "$.nodes.fix.output"
      remediate: "$.nodes.remediate.output"
      service: "$.nodes.locate.output.service"
    retry: 1

  review:
    agent: reviewer
    params:
      diff: "$.nodes.fix.output.diff"
      service: "$.nodes.locate.output.service"

  approve-commit:
    kind: approval
    name: "审批代码提交"
    params:
      diff: "$.nodes.fix.output.diff"
      test: "$.nodes.test.output"
    approvers: ["lead-engineer"]
    timeout: 7200
    on_reject: abort

  commit:
    agent: committer
    params:
      diff: "$.nodes.fix.output.diff"
      test: "$.nodes.test.output"
      service: "$.nodes.locate.output.service"

  recap:
    agent: postmortem
    params:
      rca: "$.nodes.rca.output"
      fix: "$.nodes.fix.output"
      remediate: "$.nodes.remediate.output"
      status: "$.nodes.commit.status"

# ===== 边定义（when 条件边 + skip 传播）=====
edges:
  # 诊断链
  - { from: triage, to: scope }
  # 四个取数节点各有两条入边（triage + scope）：`_check_join_consistency`
  # （core/dag.py:212）要求 required_edges 必须是**直接**上游，传递上游不算。
  - { from: triage, to: logs }
  - { from: triage, to: trace }
  - { from: triage, to: metrics }
  - { from: triage, to: infra }
  - { from: scope, to: logs }
  - { from: scope, to: trace }
  - { from: scope, to: metrics }
  - { from: scope, to: infra }
  - { from: triage, to: locate }
  - { from: triage, to: know }
  - { from: trace, to: locate }
  - { from: logs, to: rca }
  - { from: trace, to: rca }
  - { from: metrics, to: rca }
  - { from: infra, to: rca }
  - { from: locate, to: rca }
  - { from: know, to: rca }
  - { from: rca, to: plan }

  # 修复链（并行，join: all）
  - { from: plan, to: fix }
  - { from: plan, to: remediate }
  - { from: fix, to: approve-changes }
  - { from: remediate, to: approve-changes }

  # 审批通过 → 测试；拒绝 → 复盘
  - { from: approve-changes, to: test, when: "$.nodes.approve-changes.output.approved == true" }
  - { from: approve-changes, to: recap, when: "$.nodes.approve-changes.output.approved == false" }

  # 测试通过/失败都有出口
  - { from: test, to: review, when: "$.nodes.test.output.passed == true" }
  - { from: test, to: recap, when: "$.nodes.test.output.passed == false" }

  # 审查通过/失败都有出口
  - { from: review, to: approve-commit, when: "$.nodes.review.output.approved == true" }
  - { from: review, to: recap, when: "$.nodes.review.output.approved == false" }

  # 审批 → 提交
  - { from: approve-commit, to: commit, when: "$.nodes.approve-commit.output.approved == true" }
  - { from: approve-commit, to: recap, when: "$.nodes.approve-commit.output.approved == false" }
  - { from: commit, to: recap }
