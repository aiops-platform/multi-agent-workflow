[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "AIOps Bug Fix 智能体平台后端 — design-v5.2 (M0-M2 脚手架)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # 智能体运行时（design §5 锁定 2.0.3；升级前需重跑 S-001/S-011）
    "agentscope==2.0.3",
    # AgentScope 2.0.3 的 MCP 能力按 mcp SDK v1 API 编写（MCPTool 读 tool.inputSchema），
    # mcp 2.x 改 snake_case(input_schema) 会使包装崩溃；显式 pin <2（git-mcp-server 同款）。
    "mcp>=1.13,<2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # HTTP 客户端：Smart Inspection 数据面（datasource/prometheus.py）运行时依赖；
    # 原先只在 dev extra 里（测试用），接口上线后运行期也需要，故移到主依赖。
    "httpx>=0.27",
    # JWT 租户派生（§9.1；生产由 API Gateway 签发，控制面只做校验）
    "pyjwt>=2.8",
    # db_ref/凭证加密（v5.3 §5.3 管理库凭证保护）
    "cryptography>=42",
    # DeepSeek（OpenAI 兼容）经 AgentScope OpenAI 模型接入
    "openai>=1.60",
    # 生产适配器（M6 前为占位）
    "aiosqlite>=0.20",
    "kubernetes>=30",
    "psycopg[binary]>=3.1",
    "kafka-python>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # `make api` 带 --reload；uvicorn 的自动重载依赖 watchfiles，而主依赖是
    # 不带 [standard] extra 的 uvicorn —— 缺了它 --reload 会静默失效（改了代码不重载，
    # 却看不出任何报错）。这是开发侧依赖，故放 dev。
    "watchfiles>=0.22",
    # ⚠️ 加**上界**。此前是 `ruff>=0.5` —— 无上界，于是 `pip install` 装到什么就是什么。
    # 配合上面那个隐式 `select`，一次依赖刷新就能让 lint 门禁静默变红（已发生）。
    "ruff>=0.16,<0.17",
    "fakeredis>=2.23",
    # §11 分层契约的**执行者**。§11 原文写着「四条判据**应当写成测试**，比约定可靠」，
    # 但一条没写 —— 于是那四条至今只是文档，而文档拦不住任何一次 import。
    # 配置在 `.importlinter`，接在 `make lint` 里。
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
include = ["agentflow*"]

[tool.setuptools.package-data]
# 新租户的默认数据种子（非 .py 资源）。**必须显式声明**：`packages.find` 只收 .py，
# 非 editable 安装（`pip install .` / wheel）会**静默丢掉**这些 YAML，症状是新租户
# 零 workflow、零 agent 绑定。而 Dockerfile.worker 用的是 `pip install -e .`，源码树在，
# 会侥幸不丢 —— 于是本地怎么测都测不出来。
"agentflow.seed" = ["README.md", "*.yaml", "workflows/*.yaml", "agents/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ⚠️ `select` **必须显式声明** —— 这里此前没有它，于是规则集吃 ruff 的**隐式默认**。
# 而那个默认**随版本静默变宽**：本机 ruff 0.16.4 的默认是 ≈788 条规则
# （`ruff check --isolated --show-settings` 实测），而写这份配置时的默认是
# `E4,E7,E9,F` 四条族。叠加下面那个无上界的 `ruff>=0.5`，结果是：
# 某次 `pip install` 之后 `make lint` 凭空多出 19 个错误、**并且一直是红的**——
# 门禁红着，就没人跑它，"lint 通过"这个信号**从来是假的**。
#
# 所以这里把团队当时实际编码所依据的那套**写出来**：规则集要变宽，
# 必须是一次显式、有意识的改动，而不是被 pip 解析结果带进来。
select = ["E4", "E7", "E9", "F"]

# B008：FastAPI 的 `Depends(...)` 参数默认值是官方惯用法，非 bug
ignore = ["B008"]
