[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "AIOps Bug Fix 智能体平台后端 — design-v5.2 (M0-M2 脚手架)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # 智能体运行时（design §5 锁定 2.0.3；升级前需重跑 S-001/S-011）
    "agentscope==2.0.3",
    # AgentScope 2.0.3 的 MCP 能力按 mcp SDK v1 API 编写（MCPTool 读 tool.inputSchema），
    # mcp 2.x 改 snake_case(input_schema) 会使包装崩溃；显式 pin <2（git-mcp-server 同款）。
    "mcp>=1.13,<2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # HTTP 客户端：Smart Inspection 数据面（datasource/prometheus.py）运行时依赖；
    # 原先只在 dev extra 里（测试用），接口上线后运行期也需要，故移到主依赖。
    "httpx>=0.27",
    # JWT 租户派生（§9.1；生产由 API Gateway 签发，控制面只做校验）
    "pyjwt>=2.8",
    # db_ref/凭证加密（v5.3 §5.3 管理库凭证保护）
    "cryptography>=42",
    # DeepSeek（OpenAI 兼容）经 AgentScope OpenAI 模型接入
    "openai>=1.60",
    # 生产适配器（M6 前为占位）
    "aiosqlite>=0.20",
    "kubernetes>=30",
    "psycopg[binary]>=3.1",
    "kafka-python>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # `make api` 带 --reload；uvicorn 的自动重载依赖 watchfiles，而主依赖是
    # 不带 [standard] extra 的 uvicorn —— 缺了它 --reload 会静默失效（改了代码不重载，
    # 却看不出任何报错）。这是开发侧依赖，故放 dev。
    "watchfiles>=0.22",
    "ruff>=0.5",
    "fakeredis>=2.23",
]

[tool.setuptools.packages.find]
include = ["agentflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008：FastAPI 的 `Depends(...)` 参数默认值是官方惯用法，非 bug
ignore = ["B008"]
