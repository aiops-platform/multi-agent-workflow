# ===== Problem Center「分析new」：日志分析 → 根因 → 修复方案 → 诊断输出门 =====
#
# ⚠️ 本文件**不是运行时真源**：workflow 的真源是数据库（CLAUDE.md §6.0 / docs/TODO.md §13）。
#    它只是 scripts/seed_problem_log_diagnose.py 的推送载荷——改完必须重跑该脚本（幂等 PUT），
#    改这里的 YAML 而不同步到库，run 跑的还是旧流程，且没有任何提示。
#
# 场景：问题单（APM Problem Center）→ 日志证据 + 代码定位 → 根因 → 修复方案
#       →【诊断输出门·人】裁定。
#
# ⚠️ **2026-09-21 起本流程不再改代码**：原来的修复段
#    （fix → test → review → 证据门 → commit）已整体删除，`recap` 一并删除。
#    理由：Problem Center 里人要拍板的是「这条问题单要不要处理、派给谁做」，
#    而不是让平台在沙箱里替人改代码。三种裁定的落点是：
#      拒绝·重新分析 → APM 驳门 + 起一轮新的 run（真源在 APM 侧，不在本图）
#      忽略          → APM 驳门 + 关单
#      升级          → APM 放行本门 → **run 内建单**（`create-ticket` 节点）→ APM 回读
#                      该节点的工单号、绑回问题单、问题单转 `escalated` 终态
#    ⚠️ 建单**在图里**（2026-09-21 从 APM 侧搬进来的）：这样它在流程图里有落点，且与放行门
#    是一次决策。代价是 APM 要**回读** run 的节点输出拿号——`inline` 下同步拿得到，
#    `queue` 下要轮询（见 APM 侧 `_decide_agentflow`）。
name: problem-log-diagnose
version: "2.0.0"
description: "Problem Center 分析new：日志分析 → 根因 → 修复方案 → 诊断输出门（拒绝重跑 / 忽略 / 升级开单）"

inputs:
  bug_report:
    type: object
    required: true
    description: "问题单平铺 ticket（APM _build_ticket：number/short_description/description/cmdb_ci/symptom/requestId…）"
  window_start:
    type: string
    required: true
    description: "日志窗口起（UTC ISO8601，由 first_seen_at/detected_at 推导）"
  window_end:
    type: string
    required: true
    description: "日志窗口止（UTC ISO8601，由 last_seen_at/detected_at 推导，跨度 ≤24h）"

nodes:
  # ── 症状分类（无工具，只读工单文本；不传时间窗——它没有数据工具）──────────────
  triage:
    agent: triage
    require: [bug]
    params:
      bug: "$.inputs.bug_report"
    on_failure: abort

  # ── 日志证据：本流程**唯一**的取数节点 ────────────────────────────────────────
  # 目标服务来自问题单的 CMDB CI（记录本身就是权威答案），不经 service-scoper 再推一遍。
  # `service`（标量）与 `services`（候选集）两种形态同时传是刻意的：
  #   service  → require 的锚点（列表形态缺元素时 _usable([None]) 仍为 True，抓不住）
  #   services → prompt/Schema 约定的候选集形态；evidence_source 如实标 ticket_cmdb_ci，
  #              不能把工单给的服务写成上游推断（那是伪造证据来源）
  logs:
    agent: log-analyst
    require: [service, start_time, end_time]
    retry: 1
    params:
      bug: "$.inputs.bug_report"
      service: "$.inputs.bug_report.cmdb_ci.name"
      services:
        - service: "$.inputs.bug_report.cmdb_ci.name"
          confidence: high
          evidence_source: ticket_cmdb_ci
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    # abort：日志是本流程唯一的证据来源。拿不到日志就不该出计划——显式失败好过
    # 让下游对着空证据编一份"修复方案"（伪归因）。要放宽见 plan 的"开放点"。
    on_failure: abort

  # ── 历史知识：**已移除** ──────────────────────────────────────────────────────
  # 原 know 节点用占位工具 `search_knowledge`，它恒返回写死的 INC0001——一次真实 run 里
  # 却调了 5 次（占全部 14 次工具调用的 1/3），纯开销且对根因无贡献。
  # 接真实知识库后再加回；届时记得同步 rca 的 required_edges 与 params。

  # ── 代码定位（MCP locate_repo / get_service_topology）────────────────────────
  locate:
    agent: code-locator
    require: [target_service]
    params:
      bug: "$.inputs.bug_report.short_description"
      target_service: "$.inputs.bug_report.cmdb_ci.name"
    on_failure: continue

  # ── 根因（只吃日志证据）──────────────────────────────────────────────────────
  # join: all + required_edges 必须列**全部**直接上游（core/dag.py:212 只认直接上游；
  # 默认 join: any 会在 triage 一完成就把本节点拉起来——此时 logs 还没跑）。
  rca:
    agent: root-cause
    join: all
    required_edges: [triage, logs, locate]
    require: [logs]
    params:
      logs: "$.nodes.logs.output"
      code: "$.nodes.locate.output"
      symptom: "$.nodes.triage.output.summary"
      scope_primary: "$.inputs.bug_report.cmdb_ci.name"
      # 未采集的三维**显式**写成负证据：不留空键，避免模型假装核对过
      trace: "本次未采集（log-only 流程：链路数据源未接入）"
      metrics: "本次未采集（log-only 流程）"
      infra: "本次未采集（log-only 流程）"
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    on_failure: abort

  # ── 修复方案（诊断产物的一部分，**不再被执行**）──────────────────────────────
  # agent 与入参名**必须同时改**：remediation-planning-analyst 只读 `root_cause` 一个入参，
  # 沿用 `rca` 的话 require 会静默放过 None（预检按同名 key 查），agent 拿到空输入。
  # 它现在只喂两处：
  #   ① 门节点的 params（审批卡片要看方案）
  #   ② APM 的诊断快照 —— `from_agentflow._build_options` 读 `plan` 节点产出
  #      ⇒ `conclusion.recommended_fix`，即 View Diagnosis 里的「修复方案」页签。
  #      ⚠️ 前端「拒绝·重新分析」按钮的可用性判据（`canReject`）就建立在这上面，
  #      删掉 plan 节点会让那条按钮静默消失。
  plan:
    agent: remediation-planning-analyst
    require: [root_cause]
    params:
      root_cause: "$.nodes.rca.output"
    on_failure: abort

  # ── 诊断输出门：唯一的人工决策点 ──────────────────────────────────────────────
  # join: all + 两条入边：rca 与 plan 都是**直接**上游，审批卡片的 upstream 会把两者的
  # 完整输出都渲染出来（前端 renderRunApprovals 只画 upstream）——这就是"带根因上下文的门"。
  # ⚠️ 只写 plan 一条边 + 默认 join: any 会让 plan 一完成就弹审批；只写 rca 则在 plan 之前弹。
  #
  # `on_reject: continue` —— 驳回**不中止 run**。人工决策不是执行失败：run 仍判 done
  # （节点状态留 `rejected`），留痕在 APM 的 `diagnose_decision` evidence 与审批记录的
  # approver + comment 里。
  # ⚠️ 必须显式写 `continue`：引擎里 `on_reject` 的默认值是 `abort`，而 `abort` 下 run 直接
  #    抛 WorkflowNodeFailed 中止（run 判 failed）——那是"执行出错"的语义，不是"人否决"。
  #    判据看**状态**不看**动作**：`rejected_abort_node()` 按节点状态判定，因为 queue 模式下
  #    Worker 经 `from_checkpoint` 重建后直接 `run()`，**不经过 `approve()`**。见 docs/TODO.md §21。
  #
  # ⚠️ **驳回侧没有出边**，这是刻意的，不是漏写；通过侧有一条（→ create-ticket）。
  #    `continue` + 没有驳回边是引擎明确允许的形状（core/dag.py 的
  #    `_check_on_reject_consistency` 只拦反方向「abort + 有驳回边」那个矛盾组合；
  #    先例 tests/test_run_api.py 的 APPROVAL_YAML 就是同形状）。语义是"驳回后下游全部失活、
  #    run 照常收敛（不中止）"——run 仍判 done，留痕在门节点的 `rejected` 状态里。
  #    **不要**为了"看起来完整"补一条 `approved == false → halt` 之类的边：驳回不是中断，
  #    halt 一旦执行会把其余 PENDING 节点全部 SKIPPED，语义完全不同（CLAUDE.md §3.1）。
  #
  # timeout 86400：审批由人驱动；inline 模式下超时后没有人消费 resume 命令（见 plan §7.1），
  # 给足一天，避免演示时被 sweeper 自动驳回。
  diagnose-output:
    kind: approval
    name: "诊断输出 · 人工裁定（升级 = 生成工单）"
    join: all
    required_edges: [rca, plan]
    params:
      rca: "$.nodes.rca.output"
      plan: "$.nodes.plan.output"
    approvers: []
    timeout: 86400
    on_reject: continue

  # ── 建单：升级的落点 ─────────────────────────────────────────────────────────
  # 「升级」= 认可诊断 → **在租户库里建一张修复工单**。这一步住在 run 内部（而不是 APM
  # 调一次 `POST /tickets`），是为了让它在流程图里有落点、也让它和放行门是一次原子决策。
  #
  # ⚠️ 本节点**不走 runner、不调 LLM**（executor 的 `invoke()` 里按 `is_ticket` 分支），
  #    但**走 `_run_with_retry`** —— 于是 require 预检 / retry / timeout / on_failure 全套都在。
  #    刻意不学 `halt` 在调度处短路：halt 的语义是"不重试、不做幂等"，而建单是真副作用，
  #    恰恰最需要这些。
  #
  # 幂等：**建单前按 `source_ref` 查重，已建过就返回那张已存在的（成功）**，
  #    见 `TicketStore.create_once`。不变量比引擎的 `external_operation_id` 更强——
  #    后者只活在 attempt 账本里，管得住"同 run 重放"，管不住"同一条数据被两个 run 各建一张"。
  #
  # `on_failure` **必须 abort**（加载期会拦 `continue`）：`continue` 会把失败变成
  #    negative_evidence 并**把节点标 DONE** —— 建单失败会"看着成功"，而 APM 回读到的是
  #    一份没有 ticket_id 的负证据。
  create-ticket:
    kind: ticket
    on_failure: abort
    require: [source_ref, bug_report]
    params:
      # 幂等判据 = **这条数据**（问题单号），不是 run —— 见上面那段。
      # 它在 require 里，所以工单没号时会 fail-fast，而不是建一张无法去重的单。
      source_ref: "$.inputs.bug_report.number"
      bug_report: "$.inputs.bug_report"
      window_start: "$.inputs.window_start"
      window_end: "$.inputs.window_end"
      severity: "$.inputs.bug_report.severity"
      # 诊断结论随工单走：拿到工单的人不必回平台翻诊断。
      rca: "$.nodes.rca.output"
      plan: "$.nodes.plan.output"

  # ── 中断终点 ─────────────────────────────────────────────────────────────────
  # **不写 params**：halt 的 reason/missing 由 executor 从**触发它的那条入边**的上游输出
  # 直接搬运（_halt_output ← _edge_active）。写死指向某个节点是踩过坑的——换个触发点就会
  # 把不相关的摘要当中断理由，读起来完全误导。
  # 它不经 runner：不调 LLM、不重试、不做幂等（CLAUDE.md §3.1）。
  # 一旦执行，其余 PENDING 节点全部 SKIPPED（_process_skips 统一裁决）。
  # ⚠️ 它的两条入边**不能少**：实测把 halt 挂成无入边的孤立节点时，它会立刻判定为 ready
  #    并执行 → 触发全局跳过，整条 run 只剩它一个 DONE。
  halt:
    kind: halt

edges:
  # ── 诊断链 ───────────────────────────────────────────────────────────────────
  - { from: triage, to: logs }
  - { from: triage, to: locate }
  - { from: triage, to: rca }
  - { from: logs,   to: rca }
  - { from: locate, to: rca }
  - { from: rca,  to: plan }
  - { from: rca,  to: diagnose-output }
  - { from: plan, to: diagnose-output }

  # ── 门之后：通过 → 建单；驳回 → 无边（见门节点上的说明）───────────────────────
  # 「升级」就是走这条边：放行门 → 建单。工单号由本节点产出，APM **回读**这个节点的
  # 输出拿号（它不再自己建单——两边都建会出两张单）。
  - { from: diagnose-output, to: create-ticket, when: "$.nodes.diagnose-output.output.approved == true" }

  # ── 中断点（halt）────────────────────────────────────────────────────────────
  # 判据必须是**图上的 kind**（halt_triggered()），且**只需加一条 when 边**——
  # 不要用"给每条通往门/后续的边加 when"来实现中断：漏一条边就前功尽弃（实测踩过）。
  #
  # ① 根因环节判定证据不足（rca 不再被迫编一个根因类型）。
  - { from: rca, to: halt, when: "$.nodes.rca.output.insufficient == true" }
  # ② 代码定位环节拿不到目标服务（locate 输 `found: false`，或 require 预检失败后
  #    走 negative_evidence() 产出的负证据——两条路径都带 `found: false`）。
  #    没有仓库就没有"改哪里"：早先继续往下会让 fix **从 plan 的文字里猜一个仓库**去改，
  #    而工作区默认全量准备、service 传错也不报错 → **猜错静默通过**。
  #    修复段已删，但这条 gate 仍要留：`found: false` 同时意味着诊断链的代码证据是空的，
  #    该中断而不是让人对着半份证据拍板（docs/TODO.md §20，run_c9eb2fe68d）。
  - { from: locate, to: halt, when: "$.nodes.locate.output.found == false" }
