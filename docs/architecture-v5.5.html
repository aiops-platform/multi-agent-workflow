  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1360px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.86rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
      max-width: 62ch;
      line-height: 1.5;
    }

    svg { width: 100%; min-width: 1040px; display: block; overflow-x: auto; }
  </style>

    <p class="eyebrow">架构 · v5.5 数据面 MCP 化</p>
    <h1>AIOps 智能体平台</h1>
    <p class="subtitle">
      诊断与修复的数据查询<strong>全部经 MCP</strong>——进程内直连实现已删除。
      语义映射住在 MCP server 侧，agent 只传领域语义（如 <code>metric=cpu_percent</code>），
      不传查询表达式。
    </p>

        Agent 与工具治理层（15-agent 编队、本地工具、MCP 客户端、审批闸门）、
        数据面与执行层（aiops-datasource-mcp-server、副作用执行、状态与基础设施）。
        数据查询全部经 MCP server 访问 Elasticsearch、Prometheus、Kubernetes。
      </desc>
