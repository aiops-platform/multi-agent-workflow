# docker-compose.yml — 本地基础设施：PostgreSQL(StateStore) + Redis(Lock) + Kafka(队列)
#
# 对齐 agentflow/config.py 与 .env 的 DSN：
#   PostgreSQL  localhost:5432  db=agentflow user=agentflow password=agentflow
#   Redis       localhost:6379  （无密码）
#   Kafka       KRaft 单节点，双 listener：
#     PLAINTEXT  10.89.0.9:9092（静态 IP，供 minikube K8s Worker，见下）
#     EXTERNAL   localhost:19092（宿主 mac 进程：AGENTFLOW_KAFKA_BOOTSTRAP=localhost:19092）
#
# 用法：
#   docker compose up -d          # 启动（postgres/redis/kafka）
#   docker compose ps             # 查看状态
#   docker compose down           # 停止并删除容器（保留数据卷）
#   docker compose down -v        # 连同数据卷一起删（清空数据）
#
# 首次启动会自动执行 docker/init/*.sql 建表（仅空数据卷时执行一次），
# 之后应用以 PostgresStateStore 连接时也会 CREATE TABLE IF NOT EXISTS，幂等。
#
# 镜像源注意：docker.1ms.run mirror 曾 Cloudflare 403 → 全部用 docker.io（本机直连可用）。
# 若要把中间件暴露给 minikube K8s（沙箱/Worker Deployment），需把 minikube 并入本网络：
#   podman network connect backend_default minikube
# 并保持 kafka 静态 IP（顶层 networks.ipam，KAFKA_ADVERTISED_LISTENERS 依赖它）。
services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: agentflow-postgres
    networks:
      - default
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro   # 首次启动自动建表
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:8.4-alpine
    container_name: agentflow-redis
    networks:
      - default
    command: ["redis-server", "--appendonly", "yes"]   # 开启 AOF 持久化
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: docker.io/apache/kafka:3.7.2
    container_name: agentflow-kafka
    # KRaft 单节点（broker + controller 合一，无需 zookeeper）。
    # 双 listener：PLAINTEXT(:9092, advertised=静态 IP 10.89.0.9) 供 minikube K8s Pod
    #   （minikube 已并入 backend_default 网络）消费租户 topic；
    # EXTERNAL(:19092, advertised=localhost) 供宿主 mac 进程（kafka_bootstrap=localhost:19092）。
    # kafka 固定 ipv4_address=10.89.0.9（见顶层 networks）→ advertised 不随 recreate 漂移。
    networks:
      default:
        ipv4_address: 10.89.0.9
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://10.89.0.9:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CLUSTER_ID: "agentflow-local-kraft"
      # 平台自动按租户建 run.trigger.{tenant} / run.command.{tenant}，允许自动建 topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 沙箱执行服务（design §4.1 / §10.2）—— Worker 的"写文件 / 跑测试"经它执行。
  #
  # ## 为什么与 pg/kafka 并列放在这里
  #
  # 它是**系统默认形态的一部分**，不是可选组件：不接它的后果不是"少个功能"，而是
  # `ws_write_file` / `ws_run_tests` 一律 fail-closed（见 agents/tools.WORKSPACE_SANDBOXED）
  # —— 修复不落盘、测试一条不跑，而 `tester` 只能如实报 `passed: false`。实测踩过
  # （run_668981c0a7），图上一片绿、实际什么都没验证。
  #
  # ## 为什么用 java21 变体
  #
  # 测试床三个服务是 Java（`./gradlew test`）。基础镜像刻意不含工具链（它要保住
  # "零依赖、离线可建"），Java 能力由 `Dockerfile.java21` 叠加，gradle 发行版与依赖
  # 缓存已**烤进镜像**（冷跑 560s → 16.87s，且不需要网络）。
  #
  # ## 卷为什么挂在 $HOME 而不是 /tmp
  #
  # macOS 的 podman machine 是台 Linux VM，**只共享 $HOME / /Users / /private**，
  # `/tmp` **不在**其中 —— 挂 `/tmp/agentflow-workspace` 会直接报
  # `statfs ... no such file or directory`（实测）。所以宿主的 workspace_root 也一并
  # 挪到 `$HOME/agentflow-workspace`（见 .env 的 AGENTFLOW_WORKSPACE_ROOT），
  # 两边**必须同路径**：worker 按宿主机路径写 workspace，沙箱按同一条路径去读。
  #
  # ⚠️ **本容器一个凭据都不能有**（见 docker/sandbox/Dockerfile.java21 顶部）：
  # 它执行的是仓库里的代码，而 worker 容器持有 DeepSeek key / DB DSN / MCP 凭证。
  # 判据：谁持有密钥，谁不执行不可信代码。往这里塞任何 AGENTFLOW_* 密钥都等于把隔离作废。
  sandbox:
    image: localhost/agentflow-sandbox-java21:local
    container_name: agentflow-sandbox
    networks:
      - default
    ports:
      - "44772:44772"
    environment:
      # 可写白名单（§10.2）。工作区必须在内，否则 ws_write_file 会被拒
      # （报错文案是「路径不在可写白名单」——那是**正确**的拒绝，不是故障）
      SBX_WRITABLE: "/workspace:/tmp:${HOME}/agentflow-workspace"

      # ⚠️ **compose 形态必须显式绑 0.0.0.0**，不能吃 exec 服务的 loopback 默认值。
      #
      # `a515ea1` 把 `create_server` 的默许绑定改成了 `127.0.0.1`，理由写在
      # exec_service.py 的 docstring 里：「需要它的只有同 Pod 的 worker（走 127.0.0.1），
      # 而 `kubectl port-forward` 打进的是 Pod 的 loopback」—— **那条推理只对 K8s 成立**。
      #
      # compose + podman(macOS) 下，宿主经 `ports:` 发布进来时落点是**容器的 eth0 IP**
      # （实测 10.89.0.x），不是 loopback。于是绑 127.0.0.1 的服务收不到这条连接，
      # 表现为宿主 **TCP 连得上、HTTP 被 RST**（`curl: (56) Recv failure: Connection reset`），
      # 而容器自己的 healthcheck（容器内打 127.0.0.1）**照样是 healthy** —— 两处结论相反，
      # 极具误导性。实测（2026-09-22）：同一个镜像，`SBX_HOST=0.0.0.0` 宿主通、
      # 默认 loopback 不通，其余条件完全相同。
      #
      # 这**不是放宽安全边界**：容器在 podman VM 的 `backend_default` 桥内，
      # 桥上只有本栈自己的 pg/kafka/redis/sandbox。K8s 形态不受影响 ——
      # 那边走 sidecar 共享 netns，不经过端口发布（见 deploy/worker-deployment.yaml）。
      SBX_HOST: "0.0.0.0"
    volumes:
      - ${HOME}/agentflow-workspace:${HOME}/agentflow-workspace
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:44772/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  kafkadata:

# 显式网络：kafka 固定静态 IP（advertised 依赖它，容器 recreate 不漂）
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24
          gateway: 10.89.0.1
