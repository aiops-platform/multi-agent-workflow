# ⚠️ `distributionUrl` 必须与测试床服务**逐字相同**。
#
# gradle wrapper 把发行版放在 `$GRADLE_USER_HOME/wrapper/dists/<name>/<hash>/`，
# 而 `<hash>` 由 **distributionUrl 字符串**算出——URL 差一个字符，缓存就命中不了，
# 烤进去的发行版等于白烤（运行时照样重新下载）。
#
# 其余参数**不影响哈希**，所以这里可以放宽：测试床那份是
# `networkTimeout=10000` + `retries=0`，在这条慢链路上 10 秒必超时
# （实测：宿主预热就是这样失败在 "timeout (10000ms)"）。镜像构建期放宽它。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
networkTimeout=120000
retries=5
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
