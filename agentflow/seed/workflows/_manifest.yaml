  · agent 名全部在内置注册表（DIAGNOSE_AGENTS ∪ FIX_AGENTS），不依赖任何自定义 agent；
  · YAML 正文不含 URL / 端口 / 本机路径等环境绑定，只有 name 标签与注释里提到服务名。
  ⚠️ scenario1 独有的 `remediate`（K8s 止血）分支目前**只产计划、不执行**——
