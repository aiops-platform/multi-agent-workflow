# ⚠️ 这是**种子**，不是 workflow 的真源。真源是数据库（CLAUDE.md §6.0）。
#
# 只在租户库 `workflows` 表**为空**时写入一次（新租户建库后）。
# **改了这里对已存在的租户没有任何效果**——要改已开通租户，走 `PUT /workflows/{wid}`。
#
# 顺序即语义：播种时按本表顺序给 `created_at` 递增（base + i*1ms），而
# `GET /workflows` 是 ORDER BY created_at DESC、`POST /tickets/{tid}/run` 未指定
# `workflow_id` 时取 `saved[0]` ⇒ **本表最后一条 = 新租户的默认流程**。
# （这是**兜底**了：工单在建单时钉了 `next_workflow` 就按钉的走，见 `api/app.py`
#  的 `_workflow_for_ticket` —— 只有没钉过的老工单与手建单才轮到这条顺序。）
#
# 每条 YAML 的 `name:` 字段由播种器从正文解析，不在本表重复（避免两处漂移）。
source: agentflow-otr
