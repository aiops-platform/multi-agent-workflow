# ===== Problem Center 修复工作流：诊断结论 → 计划 → 修复+止血 → 测试 → 审查 → 提交 → 合并 → CI → 发布门 → 部署 → 部署后验证 → 工单回传 =====
#
# 由 bug-fix-scenario2 **简化**而来：诊断段
# （triage / scope / logs / trace / metrics / infra / locate / know / rca + halt）**整段去掉**，
# 只留修复段。诊断结论不再是图里的节点产出，而是**工单里带着的那一份**：
# `inputs.bug_report.diagnosis.{rca, plan}` —— 升级建单时由上游 problem-log-diagnose 的
# rca / plan 两个节点写进去（见 `ticket_store._ticket_fields_from_params`）。
#
# 代价写在这里，免得读图的人以为漏画了：**没有诊断就没有本流程**。`plan` 用
# `require: [problem, rca, solution]` 把它设成硬前置——缺了就 fail-fast，而不是让
# fix-planner 对着工单标题编一份"计划"出来。
# ⚠️ 本流程同时是**新租户的默认流程**（seed 的 _manifest.yaml 末条 ⇒
#    `POST /tickets/{tid}/run` 不带 workflow_id 时跑的就是它）。所以**手建**一张没有诊断
#    的工单点「发起」，会看到「节点 plan 入参缺失/非法，未满足 require [...]」——
#    **那是设计如此**（宁可红着说"缺诊断"，也不要绿着编一份方案）。
#    升级建出来的单不带这个毛病：工单里就有诊断。
#
# 也不声明时间窗：window_start/end 是给「必填时间区间」的 MCP 取数工具用的，
# 而本图**一个取数节点都没有**——没有工具会读它，声明了只是摆设。
name: problem-diagnose-fix
version: "1.0.0"
description: "Problem Center 修复闭环：诊断结论（rca）→ 修复计划 → 计划门 → 代码修复 + K8s 止血 → 测试/审查 → 提交门 → PR → 合并主干 → 编译打包+构建镜像 → 发布门 → 部署 → 部署后冒烟验证 → 工单回传"

inputs:
  bug_report:
    type: object
    required: true
    description: >
      工单（Ticket Inbox 形态：number / short_description / cmdb_ci{name,namespace}）。
      **诊断结论在 `bug_report.diagnosis` 里**（`{rca, plan}`，升级建单时写入）——
      `plan` / `approve-plan` / `ticket-done` / `recap` 四个节点都从这里取根因。
  callback_url:
    type: string
    required: false
    description: "原系统（ServiceNow 等）接收处置结果的回调地址；缺省则不投递"

nodes:
  # ===== 计划（人工门之前）=====
  # 用 fix-planner，**不是**诊断侧的 remediation-planning-analyst：这里要的是能落地执行的
  # 改动步骤（code_fix / infra_action / config_change + target），不是给人看的方案对比。
  plan:
    agent: fix-planner
    description: "制定修复计划：产出改动步骤与影响范围（本节点只出计划，不动代码）"
    # 三个入参都取自**工单里那份诊断**（升级建单时写进 `inputs.bug_report.diagnosis`：
    # 上游 problem-log-diagnose 的 rca / plan 两个节点的产出）。
    # 缺键时 params 静默解析成 None，agent 会转头编一份计划；`require` 把这件事变成
    # 一次明确失败（NodeInputError → on_failure 生效），所以**三个键都要列进 require**。
    # ⚠️ `problem` 里也含 `diagnosis`（工单本来就把诊断塞在 bug_report 里，那是为了工单页面
    #    能显示它）。额外单列 rca / solution 是为了让**入参契约显式**——fix-planner 的提示词
    #    按这三个键名点名，靠 dict 里"只有一个大对象"来猜是猜不准的。
    require: [problem, rca, solution]
    params:
      problem: "$.inputs.bug_report"
      rca: "$.inputs.bug_report.diagnosis.rca"
      solution: "$.inputs.bug_report.diagnosis.plan"
    on_failure: abort

  # ===== 计划门（前置审批：plan 定稿 → 人工决策 → 才允许动手）=====
  # 与 scenario1/2 同款、同一个理由：`plan → fix` 若直连，则 plan 一出 fix 立刻改代码，
  # 而代码路上**其余检查全在动手之后** —— 没有任何决策点。
  #
  # 止血（remediate）也在本门下游：plan.steps 里 `type: infra_action` 的步骤，
  # 审批人在**这张卡片上一起批过**，所以本图不再单设 approve-remediate。
  # （scenario1 单设那道门，是因为它的 remediate 与 fix **并行**、不在计划门下游。）
  #
  # `on_reject: abort` —— 驳回计划 = 这次修复不做，**中止整条 run**。
  # 本节点**没有** `approved == false → recap` 边，这是有意的：abort 下那条边永远
  # 不可达，写了就是骗人（加载期也会直接报 WorkflowDAGError）。
  # 驳回留痕在审批记录（approver + comment）与节点状态 REJECTED 里。
  approve-plan:
    kind: approval
    description: "人工门：审核修复计划（仅记录，不执行修复）"
    name: "审批修复计划"
    params:
      plan: "$.nodes.plan.output"
      rca: "$.inputs.bug_report.diagnosis.rca"
    approvers: ["lead-engineer"]
    timeout: 7200
    on_reject: abort

  # ===== 修复：改代码 → 止血 → 验证 =====
  # `service` 取自工单的 CMDB CI：工作区工具的 service 必须是**已 prepare 的仓库名**，
  # 而这个 CI 名就是工作区准备的键（AGENTFLOW_REPO_MAP）。
  #
  # ⚠️ `require: [service]` 是防 docs/TODO.md §20 那个坑的第二道锁：service 解析成 None
  # 时 ws_* 工具只校验"这个 service 备过工作区没有"，而工作区默认**全量**准备 ——
  # agent 猜一个名字照样改得动，猜错了静默通过（实测 run_c9eb2fe68d：locate 明说
  # found=false，fix 自己挑了一个仓库去改）。本图没有 locate 节点，工单的 CI 就是
  # 唯一的服务来源，所以缺了直接失败。
  #
  # 不传 `repo_url`（scenario2 传了）：那是 code-locator 的产物，本图没有定位节点；
  # 而 fix-implementer 的工具（ws_list_files/read_file/write_file/git）**没有一个读它**
  # ——留着只会多一个恒为 None 的字段。
  fix:
    agent: fix-implementer
    description: "代码修复：在工作区内改代码并提交到本 run 的隔离分支"
    require: [service]
    params:
      plan: "$.nodes.plan.output"
      service: "$.inputs.bug_report.cmdb_ci.name"
    retry: 1

  # 止血（K8s）。排在 `fix` 之后、`test` 之前：test 要同时看代码改动与止血结果
  # （scenario1 的 test 也吃 remediate 输出）。
  #
  # `on_failure: continue` —— 止血失败不该吞掉"代码已修好"这条主线：它变成负证据进
  # test / recap，让下游知道"线上还没止血"。fix 是 abort，两者刻意不同。
  #
  # ⚠️ 标量 `service` 与列表 `services` 同时传是刻意的（与 problem-log-diagnose 的 logs
  # 节点同因）：标量是 require 的锚点 —— 列表形态缺元素时 `_usable([{...}])` 仍为 True，
  # 抓不住；列表才是 agent 看的候选集形态，且 `evidence_source` 如实标 ticket_cmdb_ci
  # （工单给的服务不能写成上游推断）。
  remediate:
    agent: infra-remediator
    description: "K8s 止血：产出扩缩容/重启/改配额的动作计划"
    require: [service]
    params:
      plan: "$.nodes.plan.output"
      service: "$.inputs.bug_report.cmdb_ci.name"
      services:
        - service: "$.inputs.bug_report.cmdb_ci.name"
          confidence: high
          evidence_source: ticket_cmdb_ci
      namespace: "$.inputs.bug_report.cmdb_ci.namespace"
    on_failure: continue

  test:
    agent: tester
    description: "跑测试：在工作区执行该服务登记的测试命令"
    require: [service]
    params:
      fix: "$.nodes.fix.output"
      remediate: "$.nodes.remediate.output"
      plan: "$.nodes.plan.output"
      service: "$.inputs.bug_report.cmdb_ci.name"
    retry: 1

  review:
    agent: reviewer
    description: "代码评审：审阅 diff 与测试结果，判断是否放行提交"
    params:
      diff: "$.nodes.fix.output.diff"
      service: "$.inputs.bug_report.cmdb_ci.name"

  # ===== 提交门（前置审批）=====
  # 压在不可逆动作（推分支 + 开 PR）之前，人看到的是"diff + 测试证据"。
  # ⚠️ 文案必须带上"合并"：通过之后走的是 `commit → merge`，也就是**这次点击的实际含义
  #    是"同意提交**并合并到主干**"。写成"通过后才提交 PR"是最坏的那种错 ——
  #    审批人以为只开一个 PR，实际动了 main，而图上一切正常、没有任何地方会提示。
  approve-commit:
    kind: approval
    description: "人工门：审核 diff + 测试证据，通过后提交 PR **并合并到主干**"
    name: "审批代码提交与合并"
    params:
      diff: "$.nodes.fix.output.diff"
      test: "$.nodes.test.output"
    approvers: ["lead-engineer"]
    timeout: 7200
    # 驳回沿 `approved == false → recap` 边路由（图里有显式去处），不中止 run。
    # 必须显式写 `continue`：默认是 `abort`，那会把"人否决"报成 run failed。
    on_reject: continue

  commit:
    agent: committer
    description: "提交：把工作区改动推到 PR"
    require: [service]
    params:
      diff: "$.nodes.fix.output.diff"
      test: "$.nodes.test.output"
      service: "$.inputs.bug_report.cmdb_ci.name"

  # ===== 合并（本图第一个不可逆动作）=====
  # 输入取自 commit 的输出：图上有现成的 pr_url，工具不该装作看不见去自己反查分支 ——
  # 那是把一条显式的事实换成隐式推断。但工具会拿它去核：**用 commit 给的链接去定位，
  # 同时要求它落在我自己的仓库 + 我自己的分支 + 我自己那个 commit 上**，三者任一不符
  # 就停（实现与理由见 `agents/release_tools.py`）。
  #
  # `require: [service, pr_url]` 是标量锚点（同 remediate 的写法）：pr_url 解不出来时
  # 直接 fail-fast，而不是把一个 None 喂给工具、让它去"猜一个要合的 PR"。
  # 整个 commit 输出另给一份，是 agent 的上下文（PR 号 / base_sha / 摘要）。
  #
  # `on_failure: abort` —— 这是本图第一个**动了就回不去**的节点：合不了就不该继续
  # 往下走，更不该走到 `ticket-done` 去报"已解决"。
  merge:
    agent: merger
    description: "合并：把 commit 开出的那个 PR 合入主干（squash）"
    require: [service, pr_url]
    params:
      commit: "$.nodes.commit.output"
      pr_url: "$.nodes.commit.output.pr_url"
      service: "$.inputs.bug_report.cmdb_ci.name"
    on_failure: abort

  # ===== CI：编译打包 → 构建镜像（本图第一次产出"可部署的物"）=====
  # ① 编译打包在**沙箱**里跑：执行的是仓库的 `build.gradle`（脚本），而 worker 持有
  #    全部密钥（§9.6：谁持有密钥，谁不执行不可信代码）。
  # ② 构建镜像在**宿主**跑：`docker build` 要 docker daemon/socket，而把 socket 交给
  #    沙箱等于交出宿主 root —— 它**进不了沙箱**，与放哪个节点无关。
  #    真正的隔离要**独立的 CI runner**，本仓还没有；这是债，见 docs/TODO.md §34。
  #
  # 构建前先**比树**（工作区 HEAD^{tree} vs 主干那个提交的 tree）：证明"要构建的
  # == 主干上的"。squash 之后两个 SHA 不同（实测 run_e12a47ed4d：137a75df… vs 211eae4e…），
  # 只比 SHA 会误判 —— 这条判据在 `ws_build_artifact` 里，不让模型自己判断。
  #
  # **产物在门之前就定型了**：`approve-deploy` 批的是"要把这个镜像滚上去"，
  # `deploy` 只搬运与滚动、不构建任何东西（build once, deploy many）。
  ci:
    agent: ci-builder
    description: "CI：编译打包 + 构建镜像，产出与主干一致的可部署产物"
    require: [service, merge_commit]
    params:
      merge: "$.nodes.merge.output"
      merge_commit: "$.nodes.merge.output.merge_commit"
      service: "$.inputs.bug_report.cmdb_ci.name"
    on_failure: abort

  # ===== 发布门（本图第一道**压在不可逆动作之后**的门）=====
  # 走到它时 `commit` 已推了 PR、`merge` 已把改动合进主干 —— 所以它的驳回语义
  # 与前面两道门**不一样**，见下面 `on_reject` 的说明。
  #
  # ⚠️ **审批节点的 params 从不解析**（`_process_approvals` 直接读 `node.params`）——
  #    入库的审批记录里存的是 `"$.nodes.ci.output.image_tag"` **这串表达式本身**
  #    （实测 `run_e12a47ed4d` 的 approve-commit：`{"diff": "$.nodes.fix.output.diff", …}`）。
  #    所以卡片上的数据**不是**从这里来的：它来自**上游节点的 output**
  #    （`api/app.py` 的 `upstream_out = {u: nodes[u]["output"]}`）。
  #    params 在这里的作用只有一个：**声明这张门要看什么**（给人读、给审计对账）。
  #    真要给审批人看的值，必须让**上游节点输出**里有它 —— `ci` 的输出里就有
  #    `image_tag` / `image_built` / `artifact` / `log_tail`。
  #
  # ⚠️ `timeout` **写字面量、不写 `$.` 引用**：审批元数据是从 **raw params** 读的
  #    （`_process_approvals` / `dag.py` 建图时把 timeout 折成 int），引用不会被解析。
  approve-deploy:
    kind: approval
    description: "人工门：审核构建产物（镜像 tag + 构建日志），通过后才交付"
    name: "审批发布"
    params:
      image_tag: "$.nodes.ci.output.image_tag"
      ci: "$.nodes.ci.output"
      merge: "$.nodes.merge.output"
    approvers: ["lead-engineer"]
    timeout: 7200
    # ── 驳回语义：`abort`，且**刻意没有** `approved == false` 的驳回边 ──
    #
    # 与 `approve-plan` 同款，与 `approve-commit` **刻意不同**。判据是「这道门之前，
    # 不可逆的事发生了没有」：
    #
    #   approve-plan  之前什么都没发生   → abort，没有驳回边
    #   approve-commit 之前只改了工作区（可丢弃）→ continue，驳回边 → recap
    #   approve-deploy 之前 **PR 已合、主干已动** → abort，没有驳回边
    #
    # 为什么这里不能用 `continue` + 驳回边 → recap：那样驳回后 run 会**判 done（绿）**，
    # 而工单永远停在"处理中"（`ticket-done` 在下游、是 SKIPPED）、也没有任何补偿。
    # 那正是本仓反复写的「**绿着一条没交付的 run 比红着更危险**」—— 看板会把它算成闭环。
    # 用 `abort`，驳回 = 这次发布不做，run 判 failed，图上那 4 个未跑的节点全 SKIPPED。
    #
    # 代价如实记：`abort` 下没有 recap，且 `abort` + 驳回边是**加载期会直接报错**的
    # 组合（`_check_on_reject_consistency`），所以这里不能"留一条边当退路"。
    on_reject: abort

  # ===== 部署（本图第一个真的改集群的节点）=====
  # **不构建任何东西**：产物在 `ci` 就定型了，`approve-deploy` 批的就是那个 tag
  # （build once, deploy many）。这里只做"搬运 + 滚动"。
  #
  # 工具**全部来自 MCP server `deploy-ops`**（本节点在本地 Tool Registry 里**零工具**）：
  # 该 server 持有 kubeconfig 与部署目标表，agentflow 侧不碰集群细节。
  # **部署目标（namespace/deployment/container）也不从工单取** —— 实测工单的
  # `cmdb_ci` 里没有 namespace 键（只有 name 与 service）。
  #
  # `require: [service, image_tag]` 是标量锚点：`image_tag` 解不出来就 fail-fast，
  # 而不是让工具拿一个空字符串去滚。
  #
  # ⚠️ 那台 server 有一条承重的拓扑约束（必须与 docker daemon 同机），违反时
  # **它自己会拒绝启动** —— 见 aiops-mcp-servers 的 deploy-ops-mcp-server/README.md。
  deploy:
    agent: deployer
    description: "部署：把 ci 构建的镜像装进集群并滚动到该服务上"
    require: [service, image_tag]
    params:
      image_tag: "$.nodes.ci.output.image_tag"
      ci: "$.nodes.ci.output"
      service: "$.inputs.bug_report.cmdb_ci.name"
    on_failure: abort

  # ===== 部署后验证（本图最后一道关）=====
  # 前面所有节点只证明"东西备好了 / 滚上去了"，**只有它回答「跑起来真的能响应吗」**。
  # 它同时压在 `ticket-done` 之前 —— 冒烟没过就不该回传「已解决」。
  #
  # ── **探针不由人配**（本节点唯一需要解释的地方）──
  #   · 健康层（路径 + 端口）→ 从 **Deployment 自己声明的 HTTP 探针**读
  #     （`readinessProbe` → 退 `livenessProbe` → 退 `startupProbe`；本机 order-service
  #     只声明了 livenessProbe，实测就是靠这条回退链读到的）。
  #     那句探针的语义**就是**"这容器能不能接流量"，与冒烟同义；平台再抄一份
  #     （早期那版是让人在 `DEPLOY_OPS_TARGETS` 里写 port/probes）= **第二个真源**，必然漂移。
  #   · 业务层（这次故障打到的那条链路）→ 由本图 `plan` 节点产出（`plan.verification_probe`）。
  #     它拿的是工单里那份诊断，且**最接近"这次改了什么"**。
  #     ⚠️ 那条路径**只能取自入参**（工单/rca 里出现过的接口），三条约束见 fix-planner 的提示词。
  #
  # 工具**全部来自 MCP server `deploy-ops`**（与 `deploy` 同因：集群细节与凭证留在集群侧），
  # 且都是只读的 —— 所以它**不进** `SIDE_EFFECT_AGENTS`，重跑不产生外部可见变化。
  #
  # ⚠️ 它**只探正在跑 `image_tag` 的那个 pod**：打旧 pod 得到的 200 什么都不证明。
  #    "探到旧 pod"不是理论风险 —— 本机 testbed 的启动脚本起了 7 个 `svc/` 的
  #    port-forward，其中 order-service 那个（18080）在滚动换过 pod 之后实测**打不通**
  #    （`curl` 0.011s 失败）：进程还在、服务名没变，**只有 pod 换了**。
  # 判据是**期望码的精确比对**（不放宽到 2xx）：`passed: false` 进 VERDICT_FIELDS ⇒
  #    节点判红 ⇒ run failed ⇒ **工单不回传**（同 `deploy.deployed`）。
  # `probe` 解析不出来（计划判定这次没有可探的 HTTP 链路）是**合法**的：只探健康层、
  #    输出带 `coverage: health_only`、**不判红** —— CPU 打满那类故障本就该用指标/日志验，
  #    那是另一个手段的事。但"这次没验业务链路"必须**可见**：红只会让人去关掉它，可见才会让人去看。
  verify-deploy:
    agent: smoke-tester
    description: "部署后冒烟：对刚滚上去的那个 pod 打探针（健康层 + 业务链路）"
    require: [service, image_tag]
    params:
      image_tag: "$.nodes.ci.output.image_tag"
      deploy: "$.nodes.deploy.output"
      # 业务探针**整条**从 plan 来（可能为 null ⇒ 只探健康层，见上）。
      # ⚠️ 路径要跟着 `FixPlanSchema` 的实际嵌套走：`{"plan": {…, "verification_probe": …}}`
      #    （实测 run_491af83270 的 plan 输出确实是这个形状，不是平铺的）。
      probe: "$.nodes.plan.output.plan.verification_probe"
      service: "$.inputs.bug_report.cmdb_ci.name"
    on_failure: abort

  # ===== 回传原系统（工单闭环）=====
  # ⚠️ 位置决定覆盖范围：它**只在成功路径上**（`verify-deploy` 之后）。test / review /
  # 审批驳回那几条边直接到 recap，不经过这里 —— 那些情况工单不会被回传。要让"修复没走完"
  # 也回传，得把它挪到 recap 之前的分叉点，或另加并行边（与 scenario1/2 同款、同取舍）。
  #
  # on_failure 用 abort：回传失败必须让 run 失败。工单闭环是对外承诺，静默吞掉等于
  # "界面看着成功、原系统那边什么都没收到"（`delivered` 由 VERDICT_FIELDS 判红兜一层）。
  ticket-done:
    agent: ticket-done
    description: "把 run 的处置结果回传原系统，更新工单状态"
    params:
      ticket: "$.inputs.bug_report"
      callback_url: "$.inputs.callback_url"
      rca: "$.inputs.bug_report.diagnosis.rca"
      fix: "$.nodes.fix.output"
      # commit 的整个输出：有 pr_url ⇒ 已提交；null ⇒ 这条路径没走到提交。
      commit: "$.nodes.commit.output"
      # merge 的整个输出：合并过就有 merge_commit（主干上那个提交）。
      # 它同时是"这次交付**已经落到主干**"的唯一凭据 —— commit 的 pr_url 只证明开了 PR。
      merge: "$.nodes.merge.output"
      # ci 的整个输出：有 image_tag ⇒ 产物可部署了。没有它，下游只知道"合了"，
      # 不知道"能不能发"。
      ci: "$.nodes.ci.output"
      # deploy 的整个输出：有 `deployed: true` ⇒ **真的滚到线上了**（前面几个节点
      # 都只证明"东西备好了"）。
      deploy: "$.nodes.deploy.output"
      # verify-deploy 的整个输出：有 `passed: true` ⇒ **滚上去之后真的验过了**。
      # 这是"已解决"最硬的一份凭据 —— `deploy` 只证明滚上去了，不证明它跑得起来；
      # 而 `coverage` 要一起带上：`health_only` 意味着**这次没验业务链路**
      # （合法，但回传时不能让人以为验过了）。
      verify: "$.nodes.verify-deploy.output"
    on_failure: abort

  recap:
    agent: postmortem
    description: "复盘：汇总根因、处置与后续事项"
    params:
      rca: "$.inputs.bug_report.diagnosis.rca"
      fix: "$.nodes.fix.output"
      remediate: "$.nodes.remediate.output"
      # 传 commit 的**整个输出**，不传某个字段：有 `pr_url` ⇒ 已提交；`null` ⇒ 这条
      # 路径根本没走到提交（被审批驳回）——两种含义在下游都读得出来。
      commit: "$.nodes.commit.output"
      # 同理：有 `merge_commit` ⇒ 已经落到主干；`null` ⇒ 没走到合并（被审批驳回，
      # 或合并本身失败）。复盘要能说出"这次改动到底进没进主干"。
      merge: "$.nodes.merge.output"
      # 有 `image_tag` ⇒ 产物构建出来了；`null` ⇒ 没走到 CI。复盘要能说出
      # "这次改动到底能不能发"。
      ci: "$.nodes.ci.output"
      # 有 `deployed: true` ⇒ 已经到线上了。复盘要能说出"这次改动到底上没上"。
      deploy: "$.nodes.deploy.output"
      # 有 `passed: true` / `coverage: business|health_only` ⇒ **上线后验没验、验到哪一层**。
      # 复盘要能说出"这次交付**证伪过**吗"——`deployed` 只说明滚上去了。
      verify: "$.nodes.verify-deploy.output"

edges:
  # 计划门：plan **不直达** fix —— 中间必须有人工决策点（见 approve-plan 上的说明）。
  - { from: plan, to: approve-plan }
  - { from: approve-plan, to: fix, when: "$.nodes.approve-plan.output.approved == true" }

  # 修复 → 止血 → 测试 → 审查（全线性；本图没有并行分支，故不需要 join/required_edges）
  - { from: fix, to: remediate }
  - { from: remediate, to: test }
  - { from: test, to: review, when: "$.nodes.test.output.passed == true" }
  # ⚠️ 这里**没有**「测试没过 → recap」的边：`tester.passed == false` 与
  # `reviewer.approved == false` 由 executor 的 VERDICT_FIELDS 判成**节点失败**、整条 run
  # 判 failed，那两条边因此**永远不可达**（失败节点的出边恒失活），留着就是"看着还有条
  # 退路、实际走不到"。代价：测试/审查不通过时没有复盘 —— 与 scenario1/2 同款同因。

  # 审查 → 提交门
  - { from: review, to: approve-commit, when: "$.nodes.review.output.approved == true" }

  # 提交门：通过 → 提交（并合并）；驳回 → 直接复盘（不中止 run）
  - { from: approve-commit, to: commit, when: "$.nodes.approve-commit.output.approved == true" }
  - { from: approve-commit, to: recap, when: "$.nodes.approve-commit.output.approved == false" }

  # 提交 → 合并 → CI → 发布门 → 部署 → 验证 → 回传 → 复盘。
  # ⚠️ `ticket-done` 的入边**改过五次，每次都是往右挪一格**（`git log` 逐版可查：
  #    `commit` → `merge` → `ci` → `approve-deploy` → `deploy` → `verify-deploy`），
  #    判据始终是同一条 —— **回传的判据是"有没有真的交付"，不是"流程跑到哪了"**：
  #      `commit`        只开 PR，改动没进主干
  #      `merge`         进了主干，但还没有可部署的产物
  #      `ci`            产物出来了，但**没人批准发布**
  #      `approve-deploy` 人批过了，但**集群上还什么都没发生**
  #      `deploy`        滚上去了，但**它跑不跑得起来没人问过**
  #      `verify-deploy` 冒烟过了 ⇒ 前面每一环都被一份**能证伪**的证据兜住
  - { from: commit, to: merge }
  - { from: merge, to: ci }
  - { from: ci, to: approve-deploy, when: "$.nodes.ci.output.built == true" }
  - { from: approve-deploy, to: deploy, when: "$.nodes.approve-deploy.output.approved == true" }
  - { from: deploy, to: verify-deploy, when: "$.nodes.deploy.output.deployed == true" }
  - { from: verify-deploy, to: ticket-done, when: "$.nodes.verify-deploy.output.passed == true" }
  - { from: ticket-done, to: recap }
