# ===== 场景2 完整修复工作流：结账无响应（warranty fin 缺参 + 吞异常）=====
# design §3.5：诊断（含负证据）→ 规划 → 修复（沙箱）→ 测试 → 审查 → 审批 → 提交 PR
#            → 合并 → 构建 → 发布门 → 部署 → 冒烟 → 收尾 → 复盘
#
# 末尾那 5 个节点（merge/ci/approve-deploy/deploy/verify-deploy）是**发布链**，
# 与 `problem-diagnose-fix` 上那份同源（见 `RELEASE_CHAIN_PLAN_zh-CN.md` 的 D1–D7）。
# **两份副本刻意的差异只有两处**：① `service` 取自 `$.nodes.locate.output.service`
# （本图有诊断链，服务名是 code-locator 定出来的）；② 链尾接 `ticket-closed`
# 而不是 `ticket-done`（本流程不回传原系统，见该节点上的说明）。
# 除此之外的形状（含每处"为什么"的注释）应当保持一致——改一份时看另一份。
name: bug-fix-scenario2
version: "1.0.0"
description: "场景2 跨服务代码故障完整闭环：诊断 + 沙箱修复 + 审批 + PR"

inputs:
  bug_report:
    type: object
    required: true
  # 故障时间窗（ISO8601）。数据查询工具（design-v5.6 §3.4）**必须**带时间区间——
  # 窗口来自事件源（工单 opened_at / 告警触发时刻），由调用方算好传入；
  # 不留默认值：窗口错了返回的数据就没有意义，宁可在入口处要明确的值。
  window_start:
    type: string
    required: true
    description: "诊断时间窗起（ISO8601），如 2026-09-10T08:30:00（UTC）"
  window_end:
    type: string
    required: true
    description: "诊断时间窗止（ISO8601），如 2026-09-10T10:30:00（UTC）"
  repos:
    type: object
    required: false
    description: "服务→仓库映射；不提供则由 CMDB 查询"
  # 原系统接收处置结果的回调地址。
  # **required: false** —— 不是每次调用方都提供，且写死地址会让 workflow 绑死在一个环境上。
  # ⚠️ **本流程已不再消费它**（2026-09-22）：末尾的收尾节点是 `ticket-closed`，
  # 不回传原系统（见该节点上的说明）。只有 `problem-diagnose-fix` 还在用 `callback_url`。
  # 留着这个声明是为了**向后兼容已有的在途工单**（它们的 inputs 里带着它）。
  callback_url:
    type: string
    required: false
    description: "原系统（ServiceNow 等）接收处置结果的回调地址；缺省则不投递"

nodes:
  # ===== 诊断阶段（metrics/infra 为负证据）=====
  # 取数节点把时间窗透传给 agent，agent 再原样传给 MCP 数据工具（必填参数）。
  triage:
    agent: triage
    description: "分诊：读工单，产出症状摘要与类型，供下游节点引用"
    require: [start_time, end_time]
    params:
      bug: "$.inputs.bug_report"
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    on_failure: abort

  # ===== 定位问题服务（design-v5.7 §3）=====
  # 取数之前必须先知道"查哪个服务"——否则四个取数节点只能拿 triage 的一句摘要去猜。
  #
  # **bug_report 必须单独传**：triage 的输出 schema 只有 {symptom_type, severity, summary}，
  # `bug_report.cmdb_ci.name` 在 triage 之后就丢了——不补这条，工单自带的 service 永远到不了这里。
  #
  # on_failure: abort —— 定不出服务，后面四个取数节点全是空转。
  # 注意 `insufficient: true`（信息不足）**不是失败**：节点照样成功，只是候选为空，
  # 下游退回"不带 service 过滤"的宽查询（§3.6 的"停止让用户补充"机制尚未实现）。
  scope:
    agent: service-scoper
    description: "定位问题服务：查 CMDB 业务域与拓扑，产出带置信度的候选服务集"
    join: all
    required_edges: [triage]
    params:
      bug: "$.nodes.triage.output.summary"
      bug_report: "$.inputs.bug_report"
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    on_failure: abort

  # ⚠️ 下面四个取数节点都加了 `join: all` + `required_edges: [triage, scope]`。
  # **不加就会被过早调度**：默认 `join: any` 的语义是"至少一条 ACTIVE 入边即 READY"
  # （executor/dag_executor.py:259），于是 triage 一完成它们就跑了——此时 scope 还没跑，
  # `candidate_services` 是 None。这正是 `locate` 节点已经踩过的坑（见其注释）。
  logs:
    agent: log-analyst
    description: "日志取证：按候选服务与时间窗查应用日志，找错误类型与可疑条目"
    require: [start_time, end_time]
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      services: "$.nodes.scope.output.candidate_services"
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    on_failure: continue

  trace:
    agent: trace-analyst
    description: "链路取证：按 trace_id 拉调用链，定位故障 span 与归因服务"
    require: [start_time, end_time]
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      # 工单自带的链路 ID —— **trace-analyst 唯一不依赖 scope 的输入**。
      # 没有它，那个节点只能退化成「再查一遍日志捞 trace_id」，而那一步与
      # log-analyst 一字不差（纯重复）。缺了它就如实报负证据。
      trace_id: "$.inputs.bug_report.correlation_hint.trace_id"
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    on_failure: abort

  metrics:
    agent: metrics-analyst
    description: "指标取证：查 CPU/内存/磁盘/错误率/延迟，看有无异常"
    require: [start_time, end_time]
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      services: "$.nodes.scope.output.candidate_services"
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    on_failure: continue

  # infra 用 check_infra/describe_pod（K8s 当前状态），**无时间参数**
  infra:
    agent: infra-locator
    description: "基础设施取证：查 Pod 状态、重启次数与事件（K8s 实时状态）"
    join: all
    required_edges: [triage, scope]
    params:
      bug: "$.nodes.triage.output.summary"
      services: "$.nodes.scope.output.candidate_services"
    on_failure: continue

  # join: all —— locate 的 target_service 取自 trace 输出，必须等 trace 完成。
  # 默认 join: any 会让它在 triage 一完成就被调度（trace 尚未跑完 → failing_service 为 null，
  # 导致 code-locator 只能按 ticket 的 subcategory 猜服务，可能定位错仓库）。
  # 中断终点：任一环节判定「证据不足」时走这里，**跳过整条诊断链**。
  # 存在的理由：条件边不满足时下游是 SKIPPED，而 SKIPPED 与 DONE 同属终态
  # —— run 照样 done、API 照样 success，「没找到问题」与「跑完了」分不开。
  #
  # **不写 params**：halt 的 reason/missing 由 executor 从**触发它的那条入边**的
  # 上游输出直接搬运（`_active_in_edges` → summary/missing）。写死指向某个节点是
  # 踩过坑的——原先指向 scope，加了 rca 触发点后，rca 触发的 run 会把 scope 的
  # summary（那次 scope 是成功的，在讲它定位到的服务）当中断理由，读起来完全误导。
  halt:
    kind: halt
    description: "中断：证据不足时停在这里，不再往下走（不调 LLM）"
  # ---- logs → locate：给「定位要改哪个仓库」补一条退路 ----
  #
  # 与场景1 同款改动（见 scenario1-quotation-print-fail.yaml 上的完整说明）。
  #
  # 场景2 的主路径本来就有 trace（测试床的 warranty-service 真的在报带 traceId 的错），
  # `target_service` 通常解析得出。但**工单没带 trace_id 时它必为空** ——
  # 而那正是演示里手建工单的常见形态（Ticket Inbox 的 trace_id 是选填）。
  # 那时 locate 报 found=false → 触发 `locate → halt` → 整条诊断链白跑，
  # 而同一窗口的日志里明明写着是哪个服务在报错。
  #
  # ⚠️ 证据强度不同：trace 的 failing_service 是运行时判定（强），
  # logs 的 services 是「窗口内报过错的服务」（弱，**可能是症状服务** ——
  # 场景2 恰恰是跨服务故障，症状服务与根因服务不是同一个）。
  # 所以 code-locator 用兜底时**必须**在 `target_source` 里标出来（prompt 已要求）。
  #
  # ⚠️ required_edges 必须同步加 logs：join: all 的判据是
  # `all(_edge_active(e) for e in in_edges if e.source in required)` ——
  # 只加边不加它等于**不等待** logs，`log_services` 会解析成 None。
  locate:
    agent: code-locator
    description: "代码定位：由服务名定位仓库，列出可疑文件"
    join: all
    required_edges: [triage, trace, logs]
    params:
      bug: "$.nodes.triage.output.summary"
      target_service: "$.nodes.trace.output.failing_service"
      # logs 的负证据形如 {found:false, services:[], ...}；为空数组时
      # code-locator 走"两个都空 → found:false"那条分支，语义正确。
      log_services: "$.nodes.logs.output.services"
    on_failure: abort

  know:
    agent: knowledge-lookup
    description: "知识检索：查历史相似事故与处置建议（当前为占位数据源）"
    params: { bug: "$.nodes.triage.output.summary" }
    on_failure: continue

  rca:
    agent: root-cause
    description: "根因分析：交叉核对五维取证 + scope 定位与 trace 证据，给出根因与置信度"
    # ⚠️ join: all —— **六个取证上游全部完成才启动**，缺一不可。
    #
    # 默认 join: any 时，`know → rca` 是**无条件**边，而 know 只依赖 triage：
    # triage 一完成 know 就绪并跑掉 → rca 在**下一波**被判 ready，于是与
    # logs/trace/metrics/infra **同波并发**启动。而 params 是在节点启动时解析的，
    # 那一刻四大取数节点还是 PENDING → 五个摘要全部解析成 None。
    #
    # 实测（run_8df33e75f4）：infra/logs/metrics/rca/trace 的 started_at 精确到
    # **同一微秒**，rca 落库的 params 是
    # `logs/trace/metrics/infra/code: None`——只有 `know` 有值。
    # 即"把五维摘要交给 rca 做交叉判断"这条设计**从未生效过**；因为 root-cause
    # 自带全部 5 个数据工具、自己又查了一遍，结论看着仍合理，所以一直没暴露。
    #
    # locate 早就躲过了同一个坑（见上面那条 join: all 的注释），rca 漏了。
    join: all
    required_edges: [logs, trace, metrics, infra, locate, know]
    # root-cause 也会自行取证（可用全部 5 个数据工具），故同样需要时间窗
    require: [start_time, end_time]
    params:
      logs: "$.nodes.logs.output.summary"
      trace: "$.nodes.trace.output.summary"
      metrics: "$.nodes.metrics.output.summary"
      infra: "$.nodes.infra.output.summary"
      code: "$.nodes.locate.output.summary"
      know: "$.nodes.know.output.summary"
      # design-v5.7 §6：scope 的定位（基于 CMDB，早、宽、有业务语义）与 trace 的
      # failing_service（晚、窄，但是**真实运行时证据**）一起交给根因节点做**交叉判断**。
      # 两者不一致往往正说明"症状服务 ≠ 根因服务"——那是有价值的信号，不要丢掉一方。
      scope_primary: "$.nodes.scope.output.primary_service"
      start_time: "$.inputs.window_start"
      end_time: "$.inputs.window_end"
    on_failure: abort

  # ===== 计划审批（前置审批：plan 定稿 → 人工决策 → 才允许动手）=====
  # 为什么必须加：`plan → fix` 原先**是无条件直连**——plan 一出，fix 立刻改代码，
  # 而代码路上唯一的审批 `approve-commit` 在 fix/test/review **之后**、且只 gate `commit`。
  # 于是"修复计划"这个人本该拍板的东西，没有任何决策点。
  #
  # 实测代价（run_b156f65142）：plan 自己写着「第 3、4 步落地前必须先核对代码与实际
  # 生效配置，**否则可能修错位置**」，而第 3、4 步正是 code_fix —— 它们已经跑完了。
  #
  # `on_reject: abort` —— 驳回计划 = 这次修复不做，**中止整条 run**。
  # 注意本节点**没有** `approved == false → recap` 边，这是有意的：abort 下那条边不可达，
  # 写了就是骗人。驳回留痕在审批记录（approver + comment）与节点状态 REJECTED 里。
  approve-plan:
    kind: approval
    description: "人工门：审核修复计划（仅记录，不执行修复）"
    name: "审批修复计划"
    params:
      plan: "$.nodes.plan.output"
      rca: "$.nodes.rca.output"
    approvers: ["lead-engineer"]
    timeout: 7200
    # 驳回计划 = 这次修复不做 → **中止整条 run**（on_reject 的 abort 语义）。
    # 本节点**没有** `approved == false → recap` 边，这是有意的：abort 下那条边不可达，
    # 写了就是骗人。驳回留痕在审批记录（approver + comment）与节点状态 REJECTED 里。
    on_reject: abort

  plan:
    agent: fix-planner
    description: "制定修复计划：产出改动步骤与影响范围（本节点只出计划，不动代码）"
    params: { rca: "$.nodes.rca.output" }
    on_failure: abort

  # ===== 修复阶段 =====
  fix:
    agent: fix-implementer
    description: "代码修复：在工作区内改代码并提交到本 run 的隔离分支"
    params:
      plan: "$.nodes.plan.output"
      repo_url: "$.nodes.locate.output.repo_url"
      # 工作区工具的 service 必须是已 prepare 的仓库名（= trace 定位到的故障服务）
      service: "$.nodes.locate.output.service"
    retry: 1

  test:
    agent: tester
    description: "跑测试：在工作区执行该服务登记的测试命令"
    params:
      fix: "$.nodes.fix.output"
      plan: "$.nodes.plan.output"
      service: "$.nodes.locate.output.service"
    retry: 1

  review:
    agent: reviewer
    description: "代码评审：审阅 diff 与测试结果，判断是否放行提交"
    params:
      diff: "$.nodes.fix.output.diff"
      service: "$.nodes.locate.output.service"

  # ===== 提交门（前置审批）=====
  # 压在不可逆动作（推分支 + 开 PR）之前，人看到的是"diff + 测试证据"。
  # ⚠️ 文案必须带上"合并"：通过之后走的是 `commit → merge`，也就是**这次点击的实际含义
  #    是"同意提交**并合并到主干**"。写成"通过后才提交 PR"是最坏的那种错 ——
  #    审批人以为只开一个 PR，实际动了 main，而图上一切正常、没有任何地方会提示。
  approve-commit:
    kind: approval
    description: "人工门：审核 diff + 测试证据，通过后提交 PR **并合并到主干**"
    name: "审批代码提交与合并"
    params:
      diff: "$.nodes.fix.output.diff"
      test: "$.nodes.test.output"
    approvers: ["lead-engineer"]
    timeout: 7200
    # 驳回沿 `approved == false → recap` 边路由（图里有显式去处），不中止 run。
    # 必须显式写 `continue`：默认是 `abort`，那会把"人否决"报成 run failed。
    on_reject: continue

  commit:
    agent: committer
    description: "提交：把工作区改动推到 PR"
    params:
      diff: "$.nodes.fix.output.diff"
      test: "$.nodes.test.output"
      service: "$.nodes.locate.output.service"
      # 幂等：external_operation_id = PR number

  # ===== 合并（本图第一个不可逆动作）=====
  # 输入取自 commit 的输出：图上有现成的 pr_url，工具不该装作看不见去自己反查分支 ——
  # 那是把一条显式的事实换成隐式推断。但工具会拿它去核：**用 commit 给的链接去定位，
  # 同时要求它落在我自己的仓库 + 我自己的分支 + 我自己那个 commit 上**，三者任一不符
  # 就停（实现与理由见 `agents/release_tools.py`）。
  #
  # `require: [service, pr_url]` 是标量锚点（同 fix / test 的 `service`）：pr_url 解不出来时
  # 直接 fail-fast，而不是把一个 None 喂给工具、让它去"猜一个要合的 PR"。
  # 整个 commit 输出另给一份，是 agent 的上下文（PR 号 / base_sha / 摘要）。
  #
  # `on_failure: abort` —— 这是本图第一个**动了就回不去**的节点：合不了就不该继续
  # 往下走，更不该走到 `ticket-closed` 去宣布"处理流程走完了"。
  #
  # ⚠️ `service` 取自 `locate` 的输出，**不是** `$.inputs.bug_report.cmdb_ci.name`
  #    （`problem-diagnose-fix` 那份图的写法）。本图有诊断链，服务名是 `code-locator`
  #    定出来的；照抄工单字段会让它在真实工单上恒为 None ⇒ 5 个节点全线 fail-fast。
  merge:
    agent: merger
    description: "合并：把 commit 开出的那个 PR 合入主干（squash）"
    require: [service, pr_url]
    params:
      commit: "$.nodes.commit.output"
      pr_url: "$.nodes.commit.output.pr_url"
      service: "$.nodes.locate.output.service"
    on_failure: abort

  # ===== CI：编译打包 → 构建镜像（本图第一次产出"可部署的物"）=====
  # ① 编译打包在**沙箱**里跑：执行的是仓库的 `build.gradle`（脚本），而 worker 持有
  #    全部密钥（§9.6：谁持有密钥，谁不执行不可信代码）。
  # ② 构建镜像在**宿主**跑：`docker build` 要 docker daemon/socket，而把 socket 交给
  #    沙箱等于交出宿主 root —— 它**进不了沙箱**，与放哪个节点无关。
  #    真正的隔离要**独立的 CI runner**，本仓还没有；这是债，见 docs/TODO.md §34。
  #
  # 构建前先**比树**（工作区 HEAD^{tree} vs 主干那个提交的 tree）：证明"要构建的
  # == 主干上的"。squash 之后两个 SHA 不同，只比 SHA 会误判 —— 这条判据在
  # `ws_build_artifact` 里，不让模型自己判断。
  #
  # **产物在门之前就定型了**：`approve-deploy` 批的是"要把这个镜像滚上去"，
  # `deploy` 只搬运与滚动、不构建任何东西（build once, deploy many）。
  ci:
    agent: ci-builder
    description: "CI：编译打包 + 构建镜像，产出与主干一致的可部署产物"
    require: [service, merge_commit]
    params:
      merge: "$.nodes.merge.output"
      merge_commit: "$.nodes.merge.output.merge_commit"
      service: "$.nodes.locate.output.service"
    on_failure: abort

  # ===== 发布门（本图第一道**压在不可逆动作之后**的门）=====
  # 走到它时 `commit` 已推了 PR、`merge` 已把改动合进主干 —— 所以它的驳回语义
  # 与前面两道门**不一样**，见下面 `on_reject` 的说明。
  #
  # ⚠️ **审批节点的 params 从不解析**（`_process_approvals` 直接读 `node.params`）——
  #    入库的审批记录里存的是 `"$.nodes.ci.output.image_tag"` **这串表达式本身**。
  #    所以卡片上的数据**不是**从这里来的：它来自**上游节点的 output**
  #    （`api/app.py` 的 `upstream_out = {u: nodes[u]["output"]}`）。
  #    params 在这里的作用只有一个：**声明这张门要看什么**（给人读、给审计对账）。
  #    真要给审批人看的值，必须让**上游节点输出**里有它 —— `ci` 的输出里就有
  #    `image_tag` / `image_built` / `artifact` / `log_tail`。
  #
  # ⚠️ `timeout` **写字面量、不写 `$.` 引用**：审批元数据是从 **raw params** 读的
  #    （`_process_approvals` / `dag.py` 建图时把 timeout 折成 int），引用不会被解析。
  approve-deploy:
    kind: approval
    description: "人工门：审核构建产物（镜像 tag + 构建日志），通过后才交付"
    name: "审批发布"
    params:
      image_tag: "$.nodes.ci.output.image_tag"
      ci: "$.nodes.ci.output"
      merge: "$.nodes.merge.output"
    approvers: ["lead-engineer"]
    timeout: 7200
    # ── 驳回语义：`abort`，且**刻意没有** `approved == false` 的驳回边 ──
    #
    # 与 `approve-plan` 同款，与 `approve-commit` **刻意不同**。判据是「这道门之前，
    # 不可逆的事发生了没有」：
    #
    #   approve-plan  之前什么都没发生   → abort，没有驳回边
    #   approve-commit 之前只改了工作区（可丢弃）→ continue，驳回边 → recap
    #   approve-deploy 之前 **PR 已合、主干已动** → abort，没有驳回边
    #
    # 为什么这里不能用 `continue` + 驳回边 → recap：那样驳回后 run 会**判 done（绿）**，
    # 而工单永远停在"处理中"（`ticket-closed` 在下游、是 SKIPPED）、也没有任何补偿。
    # 那正是本仓反复写的「**绿着一条没交付的 run 比红着更危险**」—— 看板会把它算成闭环。
    # 用 `abort`，驳回 = 这次发布不做，run 判 failed，图上那 3 个未跑的节点全 SKIPPED。
    #
    # 代价如实记：`abort` 下没有 recap，且 `abort` + 驳回边是**加载期会直接报错**的
    # 组合（`_check_on_reject_consistency`），所以这里不能"留一条边当退路"。
    on_reject: abort

  # ===== 部署（本图第一个真的改集群的节点）=====
  # **不构建任何东西**：产物在 `ci` 就定型了，`approve-deploy` 批的就是那个 tag
  # （build once, deploy many）。这里只做"搬运 + 滚动"。
  #
  # 工具**全部来自 MCP server `deploy-ops`**（本节点在本地 Tool Registry 里**零工具**）：
  # 该 server 持有 kubeconfig 与部署目标表，agentflow 侧不碰集群细节。
  # **部署目标（namespace/deployment/container）也不从工单取** —— 工单的 `cmdb_ci`
  # 里没有 namespace 键（只有 name 与 service），按它写 `require` 会让这条链在真实路径上 100% fail-fast。
  #
  # `require: [service, image_tag]` 是标量锚点：`image_tag` 解不出来就 fail-fast，
  # 而不是让工具拿一个空字符串去滚。
  #
  # ⚠️ 那台 server 有一条承重的拓扑约束（必须与 docker daemon 同机），违反时
  # **它自己会拒绝启动** —— 见 aiops-mcp-servers 的 deploy-ops-mcp-server/README.md。
  #
  # ⚠️ `deploy-ops` 的绑定是**per-agent、存在租户库里**的（`seed/dataplane.yaml` 只在
  #    空表时播）。租户库里缺这一行 ⇒ 本节点零工具 ⇒ 模型把工具调用写成纯文本 ⇒
  #    最终表现是"未输出合法 JSON"，**中间没有任何一步会说"绑定缺失"**。
  deploy:
    agent: deployer
    description: "部署：把 ci 构建的镜像装进集群并滚动到该服务上"
    require: [service, image_tag]
    params:
      image_tag: "$.nodes.ci.output.image_tag"
      ci: "$.nodes.ci.output"
      service: "$.nodes.locate.output.service"
    on_failure: abort

  # ===== 部署后验证（本图最后一道关）=====
  # 前面所有节点只证明"东西备好了 / 滚上去了"，**只有它回答「跑起来真的能响应吗」**。
  # 它同时压在 `ticket-closed` 之前 —— 冒烟没过就不该宣布"处理流程走完了"。
  #
  # ── **探针不由人配**（本节点唯一需要解释的地方）──
  #   · 健康层（路径 + 端口）→ 从 **Deployment 自己声明的 HTTP 探针**读
  #     （`readinessProbe` → 退 `livenessProbe` → 退 `startupProbe`）。
  #     那句探针的语义**就是**"这容器能不能接流量"，与冒烟同义；平台再抄一份
  #     = **第二个真源**，必然漂移。
  #   · 业务层（这次故障打到的那条链路）→ 由本图 `plan` 节点产出（`plan.verification_probe`）。
  #     它拿的是工单里那份诊断，且**最接近"这次改了什么"**。
  #     ⚠️ 那条路径**只能取自入参**（工单/rca 里出现过的接口），三条约束见 fix-planner 的提示词。
  #     ⚠️ 本图的 `plan` 只收 `rca` 一个入参（`problem-diagnose-fix` 那份收
  #        `problem` + `rca` + `solution`）⇒ **更容易填 `null`**。
  #        那条路径是**合法**的：只探健康层、`coverage: health_only`、**不判红** ——
  #        但"这次没验业务链路"必须**可见**。要提升命中率得动 `plan` 的入参，
  #        那是一次入参契约变更，**另起一个 task**。
  #
  # 工具**全部来自 MCP server `deploy-ops`**（与 `deploy` 同因：集群细节与凭证留在集群侧），
  # 且都是只读的 —— 所以它**不进** `SIDE_EFFECT_AGENTS`，重跑不产生外部可见变化。
  #
  # ⚠️ 它**只探正在跑 `image_tag` 的那个 pod**：打旧 pod 得到的 200 什么都不证明
  #    （进程还在、服务名没变，**只有 pod 换了**）。
  # 判据是**期望码的精确比对**（不放宽到 2xx）：`passed: false` 进 VERDICT_FIELDS ⇒
  #    节点判红 ⇒ run failed ⇒ **收尾不发生**（同 `deploy.deployed`）。
  verify-deploy:
    agent: smoke-tester
    description: "部署后冒烟：对刚滚上去的那个 pod 打探针（健康层 + 业务链路）"
    require: [service, image_tag]
    params:
      image_tag: "$.nodes.ci.output.image_tag"
      deploy: "$.nodes.deploy.output"
      # 业务探针**整条**从 plan 来（可能为 null ⇒ 只探健康层，见上）。
      # ⚠️ 路径要跟着 `FixPlanSchema` 的实际嵌套走：`{"plan": {…, "verification_probe": …}}`
      #    ——平铺一层写法不会报错，只会**恒解析成 None**（等于静默退回 health_only）。
      probe: "$.nodes.plan.output.plan.verification_probe"
      service: "$.nodes.locate.output.service"
    on_failure: abort

  # ===== 收尾：工单处理流程到此结束 =====
  # 冒烟之后、复盘之前，给这条流程一个**显式的终点**：走到这里就代表这张工单的
  # 处理流程走完了。给人看，也给图一个明确的收尾点。
  #
  # ⚠️ 它的入边**改过一次**（`commit` → `verify-deploy`），判据是"有没有真的交付"：
  #    挂在 `commit` 上时它只证明"PR 开出来了"，后面合并/构建/部署/冒烟四步全没发生
  #    也照样宣布"走完了"。现在它是**成功路径上最后一环**——前面每一环都被一份
  #    **能证伪**的证据兜着（`merge.merged` / `ci.built` / `deploy.deployed` /
  #    `verify-deploy.passed`，任一为 false 节点就判红、整条 run failed）。
  #
  # **本流程不回传原系统**（2026-09-22 起，与 scenario1 逐字同理）：此前这里挂的是
  # `ticket-done`，而本流程跑的多是**手工建的工单** —— 原系统里根本没有这张单，
  # 投过去必然 404 → `delivered: false` → 节点判红 → `on_failure: abort` 中止整条 run。
  # **那不是投递坏了，是我们不该把一张没有上游的单送去投递口。**
  # 需要回传的那条路走 `problem-diagnose-fix`，它保留 `ticket-done`。
  #
  # kind: closed 与 halt 同为**确定性**节点（不调 LLM），但**不触发全局跳过** ——
  # 它后面还有 `recap`。见 core/dag.py 的 Node.is_closed。
  ticket-closed:
    kind: closed
    description: "工单处理流程到此结束（本流程不回传原系统）"
    params:
      # **字面量**，不是 `$.` 引用：这是一句静态的话，不该由上游（最后一环往往是模型）决定。
      reason: "本流程不回传原系统 —— 手工单 / 无上游对应物"

  recap:
    agent: postmortem
    description: "复盘：汇总根因、处置与后续事项"
    params:
      rca: "$.nodes.rca.output"
      fix: "$.nodes.fix.output"
      # 原为 `status: "$.nodes.commit.status"` —— 但 CommitSchema 里**没有** `status`
      # （只有 pr_url / pr_number / base_sha），该入参实测**恒为 null**（20+ 条 run 全是）。
      # 于是"这次提交到底成没成"从来没到达复盘 agent。
      #
      # 改成传 commit 的**整个输出**：有 `pr_url` ⇒ 已提交；`null` ⇒ 这条路径根本没走到
      # 提交（被 test / review / 审批驳回，见 downstream 那几条入边）——两种含义在下游
      # 都能读出来，比一个恒空的字段诚实。
      commit: "$.nodes.commit.output"
      # 以下四条同理，各传**整个输出**，让复盘能说出"这次改动到底走到哪一步"：
      # 有 `merge_commit` ⇒ 进主干了吗；有 `image_tag` ⇒ 产物出来了吗；
      # `deployed: true` ⇒ 上线了吗；`passed` / `coverage` ⇒ **上线后验没验、验到哪一层**。
      # `deployed` 只说明滚上去了，不说明它跑得起来——所以 `verify` 那条不能省。
      merge: "$.nodes.merge.output"
      ci: "$.nodes.ci.output"
      deploy: "$.nodes.deploy.output"
      verify: "$.nodes.verify-deploy.output"

edges:
  # 诊断链
  - { from: triage, to: scope }
  - { from: triage, to: locate }
  - { from: triage, to: know }
  # ⚠️ 四个取数节点各有**两条**入边：`triage` 与 `scope`。
  # `_check_join_consistency`（core/dag.py:212）要求 `required_edges` 必须是**直接**上游
  # （`node.upstreams`），**传递上游不算**——只写 `scope → logs` 会报
  # "required_edges 不是其上游: ['triage']"。两条都必须显式声明。
  - { from: triage, to: logs }
  - { from: triage, to: trace }
  - { from: triage, to: metrics }
  - { from: triage, to: infra }
  - { from: scope, to: logs, when: "$.nodes.scope.output.insufficient == false" }
  - { from: scope, to: trace, when: "$.nodes.scope.output.insufficient == false" }
  - { from: scope, to: metrics, when: "$.nodes.scope.output.insufficient == false" }
  - { from: scope, to: infra, when: "$.nodes.scope.output.insufficient == false" }
  - { from: trace, to: locate }
  # logs → locate：trace 给不出 failing_service 时的退路（见 locate 节点上的说明）
  - { from: logs, to: locate }
  - { from: logs, to: rca }
  - { from: trace, to: rca }
  - { from: metrics, to: rca }
  - { from: infra, to: rca }
  - { from: locate, to: rca }
  - { from: know, to: rca }
  - { from: rca, to: plan }
  # plan **不直达** fix：中间必须有「计划审批」这个人工决策点。
  - { from: plan, to: approve-plan }
  - { from: approve-plan, to: fix, when: "$.nodes.approve-plan.output.approved == true" }

  # 修复 → 测试 → 审查
  - { from: fix, to: test }
  - { from: test, to: review, when: "$.nodes.test.output.passed == true" }
  # ⚠️ 这里原有两条「测试没过 / 审查没过 → 直接 recap 收口」的边，**已删**。
  # 2026-09-21 起，`tester.passed == false` 与 `reviewer.approved == false` 由 executor
  # 的 `VERDICT_FIELDS` 判成**节点失败**（红）、整条 run 判 failed —— 那两条边因此
  # **永远不可达**（失败节点的出边恒失活），留着就是"看着还有条退路、实际走不到"。
  # 代价：测试/审查不通过时不再有复盘（run 直接失败）。要保留复盘，得由平台支持
  # "收敛到 recap 之后再判失败"，那是另一件事。

  # 审查 → 提交审批
  - { from: review, to: approve-commit, when: "$.nodes.review.output.approved == true" }

  # 审批 → 提交 → 复盘
  - { from: approve-commit, to: commit, when: "$.nodes.approve-commit.output.approved == true" }
  - { from: approve-commit, to: recap, when: "$.nodes.approve-commit.output.approved == false" }
  # 提交 → 合并 → 构建 → 发布门 → 部署 → 冒烟 → 收尾 → 复盘。
  # ⚠️ `ticket-closed` 的入边**改过一次**（`commit` → `verify-deploy`），判据始终是同一条 ——
  #    **收尾的判据是"有没有真的交付"，不是"流程跑到哪了"**：
  #      `commit`        只开 PR，改动没进主干
  #      `merge`         进了主干，但还没有可部署的产物
  #      `ci`            产物出来了，但**没人批准发布**
  #      `approve-deploy` 人批过了，但**集群上还什么都没发生**
  #      `deploy`        滚上去了，但**它跑不跑得起来没人问过**
  #      `verify-deploy` 冒烟过了 ⇒ 前面每一环都被一份**能证伪**的证据兜住
  #    挂在 `commit` 上时，后面四步全没发生也照样宣布"走完了"——那是"绿着的谎"。
  - { from: commit, to: merge }
  - { from: merge, to: ci }
  - { from: ci, to: approve-deploy, when: "$.nodes.ci.output.built == true" }
  - { from: approve-deploy, to: deploy, when: "$.nodes.approve-deploy.output.approved == true" }
  - { from: deploy, to: verify-deploy, when: "$.nodes.deploy.output.deployed == true" }
  - { from: verify-deploy, to: ticket-closed, when: "$.nodes.verify-deploy.output.passed == true" }
  - { from: ticket-closed, to: recap }
  # 定位失败 → 直接到终点（halt）。此时上面四条边全 INACTIVE，
  # 取数节点 SKIPPED 级联到 rca/plan/fix…，只花到 scope 为止的代价。
  - { from: scope, to: halt, when: "$.nodes.scope.output.insufficient == true" }
  # 第二个中断点：**根因环节**判定证据不足（rca 不再被迫编一个根因类型）。
  # scope 那条管「不知道该查谁」，这条管「查了但证不出根因」——两者是不同环节的失败。
  - { from: rca, to: halt, when: "$.nodes.rca.output.insufficient == true" }
  # 第三个中断点：**代码定位环节**拿不到目标服务（`target_service` 为空 → locate 输
  # `found: false`）。没有仓库就没有"改哪里"，继续往下只会让 fix **凭 plan 的文字猜一个
  # 仓库**——而 ws_* 工具只校验该 service「备过工作区没有」，三个仓库默认全备，
  # 猜错就静默改错仓库。实测踩过（run_c9eb2fe68d）：locate 明说 found=false，
  # fix 却自己挑中 order-service 改了 QuotationService.java——对了是运气。
  - { from: locate, to: halt, when: "$.nodes.locate.output.found == false" }

