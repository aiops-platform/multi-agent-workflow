# ⚠️ 这是**种子**，不是真源。真源是租户库的 `mcp_servers` / `agent_configs` 表。
#
# 只在两张表**为空**时写入一次（新租户建库后）。改了这里对已存在的租户没有效果。
#
# 它回答的是："一个刚开通的租户，要有哪些 MCP server、哪些 agent 绑它"——
# 没有这一步，agent 的 `mcp_server_ids` 是 NULL ⇒ **每个 agent 零工具**，
# run 会跑完但每个节点都在"无证据推理"（看着成功，实则空转）。

# ── MCP server 定义 ──────────────────────────────────────────────
# **URL 是环境相关的**（本地 127.0.0.1、k8s 里是 service DNS），故不写死在这里，
# 由 `url_setting` 指向的配置项注入（见 config.py / .env.example）。
#
# ⚠️ **不要**把 `tools` / `enable_tools` / `disable_tools` 放进种子：那几个列是
# MCP server **load 时运行时发现**的结果，写进种子等于把一次性的发现冻成声明，
# 服务端工具一改就与事实不符。留 NULL，让它自己抓。
servers:
  - name: aiops-datasource
    transport: http
    is_stateful: 0
    url_setting: mcp_datasource_url
  # 发布链的部署工具（:8400）。**只绑给 deployer**。
  #
  # ⚠️ 为什么单独一台、不并进 aiops-datasource：那台被 9 个诊断 agent 绑着，
  # 而 MCP 绑定是 **server 级**粒度（docs/TODO.md §16）—— 把那台唯一的写工具
  # （rollout_deployment）加进去，等于**把滚线上的权限发给所有绑它的 agent**。
  - name: deploy-ops
    transport: http
    is_stateful: 0
    url_setting: mcp_deploy_url

# ── agent 绑定（agent 名 → [server 名]）────────────────────────────
# 绑定是 **per-agent** 的，没有租户级默认（`AgentConfigResolver.server_ids_for`
# 读的就是该 agent 那一行）——所以"最小可用"必须逐个列出。
#
# 角色的 role/stage **不在这里声明**：它们从 `agents/agent_config.py` 的静态表取，
# 种子里重复一份只会引入漂移。
#
# 注意 `triage` **不在**列表里：它不绑数据工具（设计如此，"triage 交出数据工具"）。
# 没有 DB 行 = 静态回退 = 空集 = 无工具，与 otr 库里那条 `mcp_server_ids=NULL` 的行等价。
bindings:
  service-scoper:  [aiops-datasource]
  log-analyst:     [aiops-datasource]
  trace-analyst:   [aiops-datasource]
  metrics-analyst: [aiops-datasource]
  infra-locator:   [aiops-datasource]
  code-locator:    [aiops-datasource]
  root-cause:      [aiops-datasource]
  # ⚠️ `deployer` 是本仓**第一个「工具全靠 MCP」的内置执行型 agent** ——
  # 它在本地的 `TOOL_REGISTRY` 里**一个工具都没有**，全部来自这一行绑定。
  # 绑定缺行 ⇒ 它零工具（`GET /agents` 的 `tool_count` 看得出来）⇒ 模型把工具调用
  # 写成纯文本 ⇒ 最终表现是"未输出合法 JSON"，中间没有一步会说"绑定缺失"。
  # 已开通租户改这一行要 `make sync-agents TENANT=<id>`（种子只对新租户生效）。
  deployer:        [deploy-ops]
  # 同 `deployer`：工具全靠 MCP（本节点本地零工具）。它只读，但仍走同一台 server ——
  # 因为「要探哪个 pod」是集群侧的事实，而 server 侧已经有那份目标表。
  smoke-tester:    [deploy-ops]
